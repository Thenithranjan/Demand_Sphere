services:
  - type: web
    name: retail-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_DB_HOST
        value: db.pdbybnpspykpdswotygx.supabase.co
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_USER
        value: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_URL
        value: https://pdbybnpspykpdswotygx.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: reports
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://retail-backend.netlify.app
